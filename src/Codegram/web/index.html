<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Codesight</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="acrylic">
  <canvas id="board"></canvas>

  <div id="empty" class="empty" hidden>
    <div class="empty-title" id="empty-title"></div>
    <div class="empty-hint" id="empty-hint"></div>
  </div>

  <header class="bar glass">
    <div class="brand"><svg class="mark" viewBox="5 5 90 90" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="12.5" stroke-linecap="round"><path d="M59.27 21.47 A30 30 0 1 0 59.27 78.53"/><path d="M74.54 67.26 A30 30 0 0 0 79.32 56.37"/></g><circle cx="76.01" cy="35.06" r="9" fill="var(--accent)"/></svg>Codesight</div>
    <div class="vsep"></div>
    <div class="segmented" id="view">
      <button data-v="map">Map</button>
      <button data-v="tree">Tree</button>
      <button data-v="classes">Classes</button>
      <button data-v="calls">Calls</button>
      <button data-v="flow">Flow</button>
    </div>
    <div class="segmented" id="flowstyle" title="How to draw the flow">
      <button data-v="sequence">Sequence</button>
      <button data-v="steps">Steps</button>
    </div>
    <div class="segmented" id="members" title="Which members the class boxes list">
      <button data-v="all">All members</button>
      <button data-v="public">Public</button>
      <button data-v="none">Names only</button>
    </div>
    <div class="labelled" id="depth-group" title="How many steps of callers and callees to show">
      <span class="hint">Depth</span>
      <div class="segmented" id="depth">
        <button data-v="1">1</button>
        <button data-v="2">2</button>
        <button data-v="3">3</button>
      </div>
    </div>
    <div class="segmented" id="colorby" title="What the colour of each file shows">
      <button data-v="language">Language</button>
      <button data-v="complexity">Complexity</button>
    </div>
    <button class="btn toggle" id="exc-toggle" title="Show every exception in this flow and where it is caught">Exceptions</button>
    <div class="segmented" id="metric" title="What the size of each file shows">
      <button data-v="lines">Lines</button>
      <button data-v="files">Files</button>
      <button data-v="bytes">Size</button>
    </div>
    <input id="search" class="field" placeholder="Find files" spellcheck="false" autocomplete="off">
    <div class="grow"></div>
    <button class="btn toggle" id="toggle-files">Files</button>
    <button class="btn toggle" id="toggle-details">Details</button>
    <button class="btn" id="fit">Fit</button>
    <button class="btn" id="export" title="Save or copy this diagram">Export</button>
    <button class="btn" id="rescan">Rescan</button>
    <button class="btn glyph" id="open-settings" title="Settings">⋯</button>
  </header>

  <aside class="panel glass" id="files">
    <div class="panel-head"><span id="files-title">Files</span> <span class="sub" id="files-sub"></span></div>
    <div class="list" id="list"></div>
  </aside>

  <aside class="panel glass" id="details">
    <div class="panel-head" id="d-title"></div>
    <div class="body" id="d-body"></div>
  </aside>

  <nav class="crumbs glass" id="crumbs"></nav>
  <div class="status" id="status"></div>
  <div class="tip glass" id="tip" hidden></div>

  <div class="popover glass" id="settings" hidden>
    <div class="pop-title">Settings</div>
    <div class="heading">Appearance</div>
    <div class="setting">
      <div><div>Theme</div><div class="hint">Visual Studio follows the IDE theme.</div></div>
      <div class="segmented" id="set-theme">
        <button data-v="vs">Visual Studio</button>
        <button data-v="dark">Dark</button>
        <button data-v="light">Light</button>
      </div>
    </div>
    <div class="setting">
      <div><div>Material</div><div class="hint">Acrylic softens what is behind the panels.</div></div>
      <div class="segmented" id="set-material">
        <button data-v="acrylic">Acrylic</button>
        <button data-v="clear">Clear</button>
      </div>
    </div>
    <div class="setting column">
      <div class="row-between"><span>Panel opacity</span><span class="hint" id="alpha-value"></span></div>
      <input type="range" class="slider" id="set-alpha" min="30" max="100" step="1">
    </div>
    <div class="heading">Editor</div>
    <div class="setting">
      <div><div>Follow the editor</div><div class="hint">Show where the caret is in the open view.</div></div>
      <label class="switch"><input type="checkbox" id="set-follow"><span></span></label>
    </div>
  </div>

  <div class="popover glass menu" id="export-pop" hidden>
    <div class="pop-title">Export</div>
    <div class="hint" id="export-what"></div>
    <button class="menu-item" data-export="png">PNG image<span class="hint">the whole diagram, sharp at 2×</span></button>
    <button class="menu-item" data-export="svg">SVG image<span class="hint">scales to any size</span></button>
    <button class="menu-item" data-export="mermaid-copy" id="export-mm-copy">Copy as Mermaid<span class="hint">paste into Markdown, GitHub, docs</span></button>
    <button class="menu-item" data-export="mermaid-save" id="export-mm-save">Save as Mermaid<span class="hint">a .mmd text file</span></button>
  </div>

  <script src="js/model.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/sample-code.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/code.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/map.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/calls.js"></script>
  <script src="js/dataflow.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/sample-flow.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
